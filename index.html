<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bean & Bloom Cafe</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Cafe Management System</p>
          <h1>Bean & Bloom</h1>
        </div>
        <nav class="tab-switch" aria-label="모드 전환">
          <button class="tab-btn active" data-tab="customer">고객 주문</button>
          <button class="tab-btn" data-tab="admin">관리자 대시보드</button>
        </nav>
      </header>

      <main>
        <section id="customer-tab" class="tab-panel active">
          <div class="content-grid">
            <div class="menu-section">
              <div class="section-header">
                <div>
                  <p class="section-kicker">Menu</p>
                  <h2>오늘의 메뉴</h2>
                </div>
                <div class="filter-group" aria-label="카테고리 필터">
                  <button class="filter-btn active" data-category="all">전체</button>
                  <button class="filter-btn" data-category="coffee">커피</button>
                  <button class="filter-btn" data-category="noncoffee">논커피</button>
                  <button class="filter-btn" data-category="dessert">디저트</button>
                </div>
              </div>

              <div id="menu-list" class="menu-list" aria-live="polite"></div>
            </div>

            <aside class="cart-panel">
              <div class="panel-header">
                <div>
                  <p class="section-kicker">Cart</p>
                  <h3>장바구니</h3>
                </div>
                <button id="clear-cart" class="text-btn" type="button">전체 삭제</button>
              </div>

              <div id="cart-items" class="cart-items"></div>

              <div class="cart-summary">
                <div class="summary-row">
                  <span>상품 합계</span>
                  <strong id="subtotal-price">0원</strong>
                </div>
                <div class="summary-row total-row">
                  <span>총 결제금액</span>
                  <strong id="total-price">0원</strong>
                </div>
              </div>

              <form id="order-form" class="order-form">
                <div class="field-row">
                  <label for="customer-name">이름</label>
                  <input id="customer-name" name="customerName" type="text" placeholder="홍길동" required />
                </div>
                <div class="field-row">
                  <label for="customer-phone">연락처</label>
                  <input id="customer-phone" name="phone" type="tel" placeholder="010-0000-0000" required />
                </div>
                <div class="field-row">
                  <label for="customer-request">요청사항</label>
                  <textarea id="customer-request" name="request" rows="3" placeholder="샷 추가, 얼음 적게, etc."></textarea>
                </div>
                <button class="primary-btn" type="submit">주문하기</button>
              </form>
            </aside>
          </div>
        </section>

        <section id="admin-tab" class="tab-panel">
          <div class="admin-layout">
            <div class="stats-grid" id="stats-grid"></div>

            <div class="admin-panel">
              <div class="section-header admin-header">
                <div>
                  <p class="section-kicker">Orders</p>
                  <h2>주문 현황</h2>
                </div>
                <select id="status-filter" aria-label="주문 상태 필터">
                  <option value="all">전체</option>
                  <option value="주문 접수">주문 접수</option>
                  <option value="제조 중">제조 중</option>
                  <option value="완료">완료</option>
                  <option value="취소">취소</option>
                </select>
              </div>

              <div id="admin-order-list" class="admin-order-list"></div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>

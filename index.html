<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bean & Bloom</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">☕</div>
          <div>
            <p class="brand-kicker">Cafe Management</p>
            <h1>Bean & Bloom</h1>
          </div>
        </div>

        <nav class="tab-group" aria-label="탭 메뉴">
          <button class="tab-button active" data-tab="customer" type="button">고객 주문</button>
          <button class="tab-button" data-tab="admin" type="button">관리자</button>
        </nav>
      </header>

      <main class="main-layout">
        <section id="customer-view" class="view active">
          <div class="catalog-panel card">
            <div class="section-head">
              <h2>메뉴</h2>
            </div>

            <div class="toolbar">
              <label class="search-box" for="searchInput">
                <span>🔎</span>
                <input id="searchInput" type="search" placeholder="메뉴명을 입력하세요" />
              </label>
            </div>

            <div id="categoryTabs" class="category-tabs" aria-label="카테고리 필터"></div>
            <div id="menuGrid" class="menu-grid" aria-live="polite"></div>
          </div>

          <div class="order-panel">
            <div class="cart-card card">
              <div class="section-head">
                <h2>장바구니</h2>
                <button id="clearCartBtn" class="ghost-button" type="button">전체 삭제</button>
              </div>

              <div id="cartList" class="cart-list"></div>

              <div class="summary-box">
                <div>
                  <span>상품 수</span>
                  <strong id="cartCount">0개</strong>
                </div>
                <div>
                  <span>총 금액</span>
                  <strong id="cartTotal">0원</strong>
                </div>
              </div>
            </div>

            <div class="card order-form-card">
              <div class="section-head">
                <h2>주문 정보</h2>
              </div>

              <form id="orderForm">
                <div class="field-row">
                  <label>
                    이름
                    <input type="text" id="customerName" name="customerName" required />
                  </label>
                  <label>
                    연락처
                    <input type="tel" id="customerPhone" name="customerPhone" placeholder="010-0000-0000" required />
                  </label>
                </div>

                <label>
                  결제 수단
                  <select id="paymentMethod" name="paymentMethod">
                    <option value="card">카드</option>
                    <option value="cash">현금</option>
                    <option value="simple">간편 결제</option>
                  </select>
                </label>

                <label>
                  요청 사항
                  <textarea id="requestNote" name="requestNote" rows="3" placeholder="예: 얼음 적게 부탁드려요."></textarea>
                </label>

                <button class="primary-button" type="submit">주문 완료</button>
              </form>
            </div>

            <div class="card history-card">
              <div class="section-head">
                <h2>주문 내역</h2>
              </div>
              <div id="customerOrderList" class="history-list"></div>
            </div>
          </div>
        </section>

        <section id="admin-view" class="view">
          <div class="stats-grid">
            <div class="stat-card card accent-waiting">
              <span>대기</span>
              <strong id="statWaiting">0</strong>
            </div>
            <div class="stat-card card accent-preparing">
              <span>제조 중</span>
              <strong id="statPreparing">0</strong>
            </div>
            <div class="stat-card card accent-completed">
              <span>완료</span>
              <strong id="statCompleted">0</strong>
            </div>
            <div class="stat-card card accent-cancelled">
              <span>취소</span>
              <strong id="statCancelled">0</strong>
            </div>
          </div>

          <div class="summary-row card">
            <div>
              <span>총 주문 수</span>
              <strong id="totalOrderCount">0</strong>
            </div>
            <div>
              <span>오늘 매출</span>
              <strong id="totalSales">0원</strong>
            </div>
            <div>
              <span>평균 주문 금액</span>
              <strong id="avgOrderAmount">0원</strong>
            </div>
          </div>

          <div class="card admin-list-card">
            <div class="section-head">
              <h2>주문 관리</h2>
              <select id="adminFilter" aria-label="주문 상태 필터">
                <option value="all">전체</option>
                <option value="waiting">주문 접수</option>
                <option value="preparing">준비 중</option>
                <option value="completed">완료</option>
                <option value="cancelled">취소</option>
              </select>
            </div>
            <div id="adminOrderList" class="admin-order-list"></div>
          </div>
        </section>
      </main>
    </div>

    <div id="menuModal" class="modal hidden" aria-hidden="true">
      <div class="modal-content card">
        <button id="closeModalBtn" class="close-modal" type="button" aria-label="닫기">×</button>
        <div id="modalContent"></div>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
